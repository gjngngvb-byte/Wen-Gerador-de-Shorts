services:
  - type: web
    name: wenclips-engine
    runtime: docker
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://wenclips-web.onrender.com,https://wen-gerador-de-shorts.vercel.app,http://localhost:3000
      - key: JOB_DIR
        value: /tmp/wenclips
      - key: WHISPER_MODEL
        value: tiny
      - key: SUPABASE_URL
        value: https://cneehjubgbejojpikmhx.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: wenclips-media
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
