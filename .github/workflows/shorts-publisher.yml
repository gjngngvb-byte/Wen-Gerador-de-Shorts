name: Wen Shorts Publisher

on:
  workflow_dispatch:
  schedule:
    # Brasília (UTC-3): 09:00, 14:00 and 19:00.
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "0 22 * * *"

permissions:
  contents: read

concurrency:
  group: wen-shorts-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install Python dependencies
        run: pip install -r automation/requirements.txt

      - name: Configure monitored channels
        run: |
          if [ -f automation/channels.json ]; then
            echo "Using automation/channels.json"
          else
            cp automation/channels.example.json automation/channels.json
          fi

      - name: Discover, process and publish one Short
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          WHISPER_MODEL: tiny
        run: python automation/pipeline.py
